name: CI - Validation PR

on:
  pull_request:
    branches: [dev]

jobs:
  validation:
    name: Validation PR
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          cat > backend/.env << EOF
          NODE_ENV=test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db
          PORT=4000
          EOF

          cat > frontend/.env << EOF
          VITE_API_URL=http://localhost:4000
          VITE_BASE_URL=http://localhost:5173
          EOF

          cat > e2e/.env << EOF
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db
          EOF

      - name: Build shared package
        working-directory: ./shared
        run: npm run build

      - name: Database - Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Quality Gate - Lint
        run: npm run lint

      - name: Quality Gate - Typecheck
        run: npm run typecheck

      - name: Database - Sync Schema
        working-directory: ./backend
        run: npx prisma db push --skip-generate --force-reset

      - name: Integration Tests - Jest
        working-directory: ./backend
        run: npm run test

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: E2E Smoke Tests - Playwright
        working-directory: ./e2e
        run: npx playwright test --grep @smoke
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: e2e/playwright-report/
          retention-days: 7
